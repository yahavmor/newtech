name: Update ad campaign metrics

on:
  schedule:
    - cron: "0 * * * *"   # כל שעה
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ad-metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch spend / impressions / clicks from Meta and update ad_metrics.json
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python update_ad_metrics.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ad_metrics.json
          git diff --cached --quiet || git commit -m "Update ad_metrics.json [automated]"
          git push
